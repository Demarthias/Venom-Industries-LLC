<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redirecting… | Venom Industries</title>
  <meta name="robots" content="noindex" />
  <!--
    This page's old checkout flow used hardcoded Stripe Payment Link URLs that
    were archived on the Stripe side, so every visitor here hit a dead
    "payment link no longer active" page. Retired in favor of the single
    supported checkout flow on saas-detective.html#pricing -> checkout.html,
    which stays in sync with live Stripe prices. Kept as a redirect (rather
    than deleted) so old links/bookmarks/emails still land somewhere useful.
  -->
  <meta http-equiv="refresh" content="0; url=/saas-detective#pricing" />
  <link rel="canonical" href="https://venom-industries.com/saas-detective" />
  <style>
    body { background: #0a0e13; color: #e7edf2; font-family: system-ui, sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; margin: 0; }
    a { color: #00ffc8; }
  </style>
  <script>window.location.replace('/saas-detective#pricing');</script>
</head>
<body>
  <p>Redirecting to <a href="/saas-detective#pricing">SaaS Detective pricing</a>…</p>
</body>
</html>
